<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Matt Can — Name Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <div class="controls">
      <label for="nameInput" class="visually-hidden">Name</label>
      <input id="nameInput" type="text" value="me" maxlength="30" />
      <button id="updateBtn">Update</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="memeCanvas" aria-label="Meme canvas"></canvas>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
